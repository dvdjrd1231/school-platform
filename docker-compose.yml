# Production stack: Next.js app + MongoDB, with optional Caddy for HTTPS.
#
# Two ways to run it, because only one process on a machine can hold ports
# 80 and 443:
#
#   1. This is the only site on the server — Caddy comes with the stack and
#      obtains certificates itself:
#
#        docker compose --profile standalone up -d --build
#
#   2. The server already runs a reverse proxy (another site, another stack) —
#      leave Caddy out and let the existing proxy route to this app by hostname:
#
#        docker network create web-proxy        # once, if it doesn't exist
#        docker compose up -d --build
#
#      The app is reachable from that proxy as `school-app:3000`. See
#      docs/DEPLOYMENT.md for the proxy side.
#
# Values come from .env in this directory (see .env.example). That file is
# gitignored and must never be committed.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      # The :? form makes compose refuse to start with a readable message when
      # a required value is missing, instead of substituting an empty string and
      # letting the app fail later with something cryptic.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      # Read-only, so maintenance scripts can be run with mongosh inside the
      # container without copying files in by hand. Nothing here executes on
      # its own — /docker-entrypoint-initdb.d is the auto-run path, and this
      # deliberately isn't it.
      - ./scripts:/scripts:ro
    # Deliberately no `ports:` — the database is reachable only from the
    # compose network, never from the public internet.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  app:
    build:
      context: .
      args:
        # Inlined into the client bundle at build time — see the Dockerfile.
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # authSource=admin because the user is created in the admin database.
      # Credentials go in their own variables, never interpolated into the URI:
      # a password containing / @ : + = would make the URI unparseable.
      MONGODB_URI: mongodb://mongo:27017/school-platform
      MONGODB_USER: ${MONGO_ROOT_USER}
      MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGODB_AUTH_SOURCE: admin
      AUTH_SECRET: ${AUTH_SECRET:?generate one with `openssl rand -base64 32` and set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      # Set APP_URL explicitly when serving over plain HTTP or a bare IP
      # (e.g. http://203.0.113.10). It defaults to https://DOMAIN for the
      # normal domain + TLS case. Required: an empty value here yields the
      # string "https://", which throws ERR_INVALID_URL on every request.
      NEXTAUTH_URL: ${APP_URL:-https://${DOMAIN:?set DOMAIN in .env (a hostname, or :80 when testing over a bare IP)}}
      ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER in .env (must be an email address)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_KEY: ${PUSHER_KEY:-}
      PUSHER_SECRET: ${PUSHER_SECRET:-}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER:-}
    # No published ports: the app is never exposed to the host directly. A
    # reverse proxy reaches it over the shared network below, under the stable
    # alias `school-app` — the generated container name changes with the
    # directory the stack is deployed from, so a proxy config that named it
    # would break on a rename.
    networks:
      internal:
      web-proxy:
        aliases: [school-app]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Only started by `--profile standalone`. When another proxy on the machine
    # already owns 80/443, starting a second one fails with "port is already
    # allocated" — which is a configuration choice, not something to discover
    # from a failed deploy.
    profiles: [standalone]
    ports:
      - "80:80"
      # Published on every interface for the normal domain + TLS case.
      #
      # With DOMAIN=:80 there is no TLS site, so 443 would accept connections
      # and then answer nothing. That is worse than not listening at all:
      # browsers upgrade a typed bare address to https:// and only fall back to
      # http:// when the connection FAILS. A connection that succeeds and then
      # hangs gives them nothing to fall back from, so the page sits until it
      # times out. Setting HTTPS_BIND=127.0.0.1: keeps 443 off the public
      # interface, the connection is refused immediately, and the browser
      # retries over HTTP as intended.
      - "${HTTPS_BIND:-}443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (a hostname, or :80 when testing over a bare IP)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data     # certificates — losing this re-requests them
      - caddy-config:/config
    depends_on: [app]
    networks: [web-proxy]

volumes:
  mongo-data:
  caddy-data:
  caddy-config:

networks:
  # App ↔ database only. Never touches anything outside this stack.
  internal:

  # Shared with whichever proxy fronts the machine. Declared external so the
  # same network can be joined by another compose project; create it once with
  #   docker network create web-proxy
  web-proxy:
    external: true
    name: ${PROXY_NETWORK:-web-proxy}
